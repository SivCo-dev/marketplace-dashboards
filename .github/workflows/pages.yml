name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build production 2.3 site
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          sed -e 's#../core/#./core/#g' -e 's#../config/#./config/#g' dev23/orange/index.html > _site/index.html
          cp _site/index.html _site/orange.html
          sed -e 's#../core/#./core/#g' -e 's#../config/#./config/#g' dev23/w/index.html > _site/w.html
          sed -e 's#../core/#./core/#g' -e 's#../config/#./config/#g' dev23/cpr/index.html > _site/cpr.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
